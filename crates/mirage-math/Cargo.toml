[package]
name = "mirage-math"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = { version = "0.32", features = ["serde-serialize", "bytemuck"] }
bytemuck = { version = "1.15", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }