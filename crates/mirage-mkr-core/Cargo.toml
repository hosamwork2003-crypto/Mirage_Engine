[package]
name = "mirage-mkr-core"
version = "0.1.0"
edition = "2024"

[dependencies]
# mirage-core provides ThermalSystem compat bridge and runtime primitives.
mirage-core = { path = "../mirage-core" }

# V5.5: mirage-mts is the SOLE topology owner. TopologyGraph, ExecutionLane, etc.
# are imported via mirage_mts::topology::* — NOT via mirage-matrix.
# mirage-matrix was removed (V5.5 cleanup): audit confirmed zero direct uses.
mirage-mts      = { path = "../mirage-mts" }

mirage-compute = { path = "../mirage-compute" }
mirage-executor = { path = "../mirage-executor" }
mirage-query    = { path = "../mirage-query" }
mirage-cek      = { path = "../mirage-cek" }
mirage-synapse  = { path = "../mirage-synapse" }
mirage-morphogenic = { path = "../mirage-morphogenic" }
mirage-math = { path = "../mirage-math" }
rayon = "1.8"

# serde for Handle type in pool/handle.rs
serde = { version = "1.0", features = ["derive"] }

[lib]
doctest = false
