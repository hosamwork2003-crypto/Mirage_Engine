[package]
name = "mirage-core"
version = "0.1.0"
edition = "2021"

[dependencies]
mirage-geometry = { path = "../mirage-geometry" }
mirage-math = { path = "../mirage-math" } # 🆕 ربط المكتبة الرياضية

serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }
bytemuck = { version = "1.15", features = ["derive"] }
memmap2 = "0.9.10"
# 🚀 إضافة قنوات متطورة للبث غير المتزامن
crossbeam-channel = "0.5"